rules:
  - id: hardcoded-secret-assignment
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded secret/credential detected. Move to environment variables
      or a secrets manager (.env, GitHub Secrets, Vault).
    patterns:
      - pattern-either:
          - pattern: $VAR = "gsk_..."
          - pattern-regex: '(?i)(api_key|password|secret|token)\s*=\s*["\'][A-Za-z0-9_\-]{12,}["\']'

  - id: sql-injection-string-format
    languages: [python]
    severity: ERROR
    message: >-
      Possible SQL Injection: user input formatted directly into a SQL
      query string. Use parameterized queries instead.
    patterns:
      - pattern-either:
          - pattern: $CONN.execute("..." % (...))
          - pattern: $CONN.execute(f"...")
          - pattern: $CONN.execute("..." + $VAR)

  - id: dangerous-eval-usage
    languages: [python]
    severity: ERROR
    message: >-
      Use of eval() on data that may originate from user input is a
      code execution risk. Avoid eval(); use a safe parser instead.
    patterns:
      - pattern: eval(...)

  - id: flask-debug-mode-enabled
    languages: [python]
    severity: WARNING
    message: >-
      Flask app is running with debug=True. This must never be enabled
      in production; it exposes the Werkzeug debugger and can lead to
      remote code execution.
    patterns:
      - pattern: $APP.run(..., debug=True, ...)
